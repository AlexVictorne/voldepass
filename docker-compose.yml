services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voldepass
      POSTGRES_PASSWORD: voldepass
      POSTGRES_DB: voldepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voldepass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
