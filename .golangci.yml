version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gofmt
    - goimports
    - misspell
    - exhaustive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck

linters-settings:
  gosec:
    excludes:
      # G304 допустим в конфиге (путь к файлу из конфига)
      - G304
  goimports:
    local-prefixes: github.com/alexvictorne/voldepass

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck
