name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint, test, integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      # ── Статический анализ ──────────────────────────────────────────────
      # golangci-lint-action@v6 resolves "latest" to a stale cached release
      # (v1.64.8, built with go1.24) that refuses to lint a go1.25.3 module
      # ("the Go language version used to build golangci-lint is lower than
      # the targeted Go version"). v8 resolves "latest" against current
      # releases, which are built with a Go toolchain new enough for go.mod's
      # declared version.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: go vet
        run: go vet ./...

      # migrations/ (для CLI golang-migrate) и internal/server/storage/postgres/migrations/
      # (вкомпилирована в сервер через go:embed) должны быть побайтово идентичны.
      - name: check migrations are in sync
        run: make check-migrations

      - name: go mod verify
        run: go mod verify

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # ── Юнит-тесты ─────────────────────────────────────────────────────
      - name: unit tests
        run: go test -v -count=1 -race -coverprofile=coverage.out ./internal/... ./cmd/...

      - name: coverage gate (≥70%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{gsub(/%/,""); print $3}')
          echo "total coverage: ${TOTAL}%"
          if [ $(echo "$TOTAL < 70" | bc -l) -eq 1 ]; then
            echo "coverage ${TOTAL}% is below required 70%"
            exit 1
          fi

      # ── Медленные тесты ──────────────────────────────────────────────────
      # Изолированы под build tag slow (сейчас — internal/client/tui/teatest_slow_test.go,
      # тест зависит от реального времени tea.Tick), поэтому не входят в основной
      # прогон unit tests, чтобы не замедлять обычный цикл.
      - name: slow tests
        run: make test-slow

      # ── Интеграционные тесты ────────────────────────────────────────────
      # test/integration поднимает свой собственный PostgreSQL через
      # testcontainers (см. test/integration/main_test.go) — внешний DSN не нужен.
      - name: integration tests
        run: go test -v -count=1 -tags=integration -race ./test/integration/...

      # ── E2E/smoke-тесты ─────────────────────────────────────────────────
      - name: e2e smoke tests
        run: go test -v -count=1 -tags=e2e -race ./test/e2e/...

      # ── Кросс-компиляция клиента ────────────────────────────────────────
      - name: cross-compile client (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/client

      - name: cross-compile client (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/client

      - name: cross-compile client (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/client
