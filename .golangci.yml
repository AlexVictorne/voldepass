version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - exhaustive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        # G304 допустим в конфиге (путь к файлу из конфига)
        - G304
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alexvictorne/voldepass
