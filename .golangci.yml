version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - exhaustive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        # G304 допустим в конфиге (путь к файлу из конфига)
        - G304
    exhaustive:
      # switch по DataType/tea.KeyType с явным default-веткой намеренно
      # покрывает "всё остальное" (в т.ч. будущие варианты), а не перечисляет
      # каждый case вручную — считаем такой switch исчерпывающим.
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alexvictorne/voldepass
